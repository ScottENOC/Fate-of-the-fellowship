name: Apply Shadow Burdens

on:
  push:
    branches: [feature/shadow-burdens-v1]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[shadow-burdens-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/shadow-burdens-v1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair helper and apply deterministic patch
        run: |
          node scripts/fix-shadow-burdens-helper.cjs
          node scripts/apply-shadow-burdens.cjs
      - name: Run regressions
        run: npm test
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.js index.html tests/regression.cjs
          git commit -m 'Add selectable Shadow Burdens to Legendary+ [shadow-burdens-patch]'
          git push origin HEAD:feature/shadow-burdens-v1
