name: Apply map camera cover
on:
  push:
    branches: [feature/map-camera-cover-viewport]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-map-camera-cover.cjs
      - run: npm test
      - name: Verify camera invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for (const needle of [
            'object-fit:fill',
            'const newZoom = Math.max(1, Math.min(8, mapView.zoom * factor));',
            'const minX = Math.min(0, pw - scaledW);',
            'const coverScale = Math.max(pw / iW, ph / iH);'
          ]) if(!s.includes(needle)) throw new Error('missing camera invariant: '+needle);
          if(s.includes('pw * 0.5, Math.max(pw - ww - pw * 0.5')) throw new Error('old overscroll clamp remains');
          NODE
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Make map camera cover viewport without overscroll [map-camera-cover]"
          git push
