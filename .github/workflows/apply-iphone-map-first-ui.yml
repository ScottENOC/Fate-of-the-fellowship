name: Apply iPhone map-first UI

on:
  push:
    branches: [feature/iphone-map-first-ui-v2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[iphone-ui-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/iphone-map-first-ui-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply UI patch
        run: node scripts/apply-iphone-map-first-ui.cjs
      - name: Run regressions
        run: npm test
      - name: Commit source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/regression.cjs
          git commit -m 'Make portrait play map-first on iPhone [iphone-ui-patch]'
          git push origin HEAD:feature/iphone-map-first-ui-v2
