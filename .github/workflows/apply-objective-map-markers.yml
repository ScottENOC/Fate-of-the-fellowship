name: Apply objective map markers
on:
  push:
    branches: [feature/objective-map-markers]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-objective-map-markers.cjs
      - run: npm test
      - name: Verify objective marker invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for(const n of [
            'id="objective-layer"',
            'function objectiveMapLocations(obj)',
            'function renderObjectiveMarkers()',
            "'destroy-ring':['mount-doom']",
            "'secure-osgiliath':['osgiliath']",
            "class:'objective-marker'",
            'showObjectiveDetails(objs[0])'
          ]) if(!s.includes(n)) throw new Error('missing invariant: '+n);
          NODE
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/regression.cjs
          git commit -m "Add tappable objective markers to map [objective-map-markers]"
          git push
