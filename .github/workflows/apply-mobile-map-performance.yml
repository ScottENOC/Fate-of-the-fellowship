name: Apply mobile map performance

on:
  push:
    branches: [feature/mobile-map-render-performance-v1]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-map-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-map-render-performance-v1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic patch
        run: node scripts/apply-mobile-map-performance.cjs
      - name: Run regressions
        run: npm test
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/regression.cjs
          git commit -m 'Improve portrait controls and cache static map rendering [mobile-map-patch]'
          git push origin HEAD:feature/mobile-map-render-performance-v1
