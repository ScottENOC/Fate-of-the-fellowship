name: Apply portrait pre-game HUD fix
on:
  push:
    branches: [fix/portrait-pre-game-hud]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-portrait-pre-game-hud.cjs
      - run: npm test
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/index-syntax.cjs
          git commit -m "Fix portrait pre-game HUD visibility [portrait-hud-fix]"
          git push
