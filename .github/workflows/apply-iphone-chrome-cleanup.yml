name: Apply iPhone chrome cleanup
on:
  push:
    branches: [feature/iphone-chrome-cleanup]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-iphone-chrome-cleanup.cjs
      - run: npm test
      - name: Verify portrait chrome
        run: |
          grep -q '#top-bar{display:none}' index.html
          grep -q 'background:rgba(14,12,8,.24)' index.html
          grep -q 'id="mobile-utility-menu-btn"' index.html
          grep -q "btn.textContent = opening ? '▾' : '▴'" index.html
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Simplify iPhone game chrome [iphone-chrome-cleanup]"
          git push
