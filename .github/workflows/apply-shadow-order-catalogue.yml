name: Apply Shadow order catalogue
on:
  push:
    branches: [feature/shadow-deck-reconstruction]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-shadow-order-catalogue.cjs
      - run: npm test
      - name: Verify Shadow order catalogue
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('data.js','utf8');
          const ctx=vm.createContext({Math,console});
          vm.runInContext(src,ctx);
          const vals=vm.runInContext(`({
            total:NORMAL_SHADOW_CARDS.length,
            known:NORMAL_SHADOW_CARDS.filter(c=>c.orderKnown).length,
            eye:NORMAL_SHADOW_CARDS.filter(c=>shadowOrderFamily(c.specialOrder)==='eye').length,
            move:NORMAL_SHADOW_CARDS.filter(c=>shadowOrderFamily(c.specialOrder)==='move').length,
            deploy:NORMAL_SHADOW_CARDS.filter(c=>shadowOrderFamily(c.specialOrder)==='deploy').length
          })`,ctx);
          if(vals.total!==48||vals.known!==12||vals.eye!==16||vals.move!==16||vals.deploy!==16) throw new Error(JSON.stringify(vals));
          NODE
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.js tests/regression.cjs
          git commit -m "Catalogue known Shadow third effects [shadow-orders]"
          git push
