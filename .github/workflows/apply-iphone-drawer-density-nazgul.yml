name: Apply iPhone drawer density and Nazgul touch UI
on:
  push:
    branches: [feature/iphone-drawer-density-nazgul]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-iphone-drawer-density-nazgul.cjs
      - run: npm test
      - name: Verify compact drawer invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const needles=[
            'grid-template-columns:repeat(auto-fit,minmax(118px,1fr))',
            'grid-template-columns:repeat(3,minmax(0,1fr))',
            'function showNazgulDistribution()',
            "g.onclick = e => { e.stopPropagation(); showNazgulDistribution(); };",
            '#action-hint{min-height:0!important;margin-bottom:1px!important;line-height:1.15}'
          ];
          for(const n of needles) if(!s.includes(n)) throw new Error('missing invariant: '+n);
          if(s.includes('id="nazgul-row"')) throw new Error('drawer Nazgul row still present');
          NODE
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/regression.cjs
          git commit -m "Compact iPhone drawer and make Nazgul touch friendly [iphone-drawer-density-nazgul]"
          git push
