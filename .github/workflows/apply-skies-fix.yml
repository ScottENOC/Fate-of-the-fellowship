name: Apply Skies Darken correction
on:
  push:
    branches: [feature/skies-darken-four-step]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-skies-fix.cjs
      - run: node scripts/fix-stale-fangorn-test.cjs
      - run: npm test
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.js engine.js tests/regression.cjs
          git commit -m "Correct Skies Darken sequence and Fangorn path [skies-darken]"
          git push
