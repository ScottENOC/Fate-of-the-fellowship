name: Apply current player character highlight
on:
  push:
    branches: [feature/current-player-character-highlight]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-current-player-character-highlight.cjs
      - run: npm test
      - name: Verify character highlight invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for(const n of [
            "if (isCurrentPlayer) {",
            "stroke:'#c8a050','stroke-width':0.45,opacity:0.88",
            "stroke:isCurrentPlayer?'#f0d080':'#00000088'",
            "r:2.25,fill:'none',stroke:'#ffffff'"
          ]) if(!s.includes(n)) throw new Error('missing invariant: '+n);
          NODE
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/regression.cjs
          git commit -m "Highlight current player characters on map [current-player-character-highlight]"
          git push
